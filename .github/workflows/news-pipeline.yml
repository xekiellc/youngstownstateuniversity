name: YSU News Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run news pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git stash
          git pull --rebase origin main
          git stash pop
          git add -A
          git commit -m "Auto: news refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Post to Voxxee
        run: |
          curl -s -X POST https://xenchee.netlify.app/.netlify/functions/pipeline-post \
            -H "Content-Type: application/json" \
            -H "x-pipeline-secret: ${{ secrets.PIPELINE_SECRET }}" \
            -d '{
              "slug": "youngstown-state-university",
              "title": "🐧 Youngstown State University — Latest YSU News",
              "summary": "The latest news, sports, faculty, student, and alumni updates from Youngstown State University.",
              "url": "https://youngstownstateuniversity.com"
            }'
